<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IdentiDeform Object Screening</title>
<style>
/* layout: sticky toolbar with filters and counts, then a grid of object cards */
:root { --bg:#f6f7f9; --panel:#fff; --fg:#1b2129; --muted:#5d6876; --line:#dde2e8; --accent:#2f6fdf; --ok:#1f8a5b; --bad:#c73b3b; --warn:#b7791f;
  --f:"IBM Plex Sans",system-ui,sans-serif; --m:ui-monospace,"IBM Plex Mono",monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#11151a; --panel:#181d24; --fg:#e4e8ee; --muted:#9aa5b3; --line:#2a313b; --accent:#7aa7ff; --ok:#4fc58f; --bad:#ff7b7b; --warn:#e8b04f; color-scheme:dark; } }
body { background:var(--bg); color:var(--fg); font-family:var(--f); font-size:14px; margin:0; padding:0 16px 40px; }
header { position:sticky; top:0; background:var(--bg); padding:14px 0 10px; border-bottom:1px solid var(--line); z-index:2; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
h1 { font-size:20px; margin:0; }
.counts { font-family:var(--m); font-size:12px; color:var(--muted); }
button, select { font:inherit; padding:5px 10px; border-radius:5px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; }
button.save { background:var(--accent); color:#fff; border-color:var(--accent); }
button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
#status { font-size:12px; color:var(--muted); }
.help { max-width:75ch; color:var(--muted); margin:10px 0 14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.card.bad { border-color:var(--bad); } .card.keep { border-color:var(--ok); } .card.unsure { border-color:var(--warn); }
.card img { width:100%; background:#000; border-radius:4px; display:block; }
.name { font-size:12.5px; word-break:break-all; } .meta { font-family:var(--m); font-size:11px; color:var(--muted); }
.row { display:flex; gap:6px; flex-wrap:wrap; }
.row button { padding:3px 9px; font-size:12.5px; }
.row button.on.keep { background:var(--ok); color:#fff; border-color:var(--ok); }
.row button.on.bad { background:var(--bad); color:#fff; border-color:var(--bad); }
.row button.on.unsure { background:var(--warn); color:#fff; border-color:var(--warn); }
input[type=text] { font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); width:100%; box-sizing:border-box; }
</style></head><body>
<header>
  <h1>Object screening</h1>
  <label for="flt">Show</label>
  <select id="flt"><option value="all">all</option><option value="none">not marked</option><option value="bad">bad</option><option value="unsure">unsure</option><option value="keep">keep</option></select>
  <select id="split"><option value="all">all splits</option><option value="train">train</option><option value="val">val</option><option value="test">test</option></select>
  <button class="save" id="save">Save marks</button>
  <span id="status"></span>
  <span class="counts" id="counts"></span>
</header>
<p class="help">每个物体显示一个样本第一帧的三个视角。标记几何质量差的物体为 <b>bad</b>（会从 V3 数据中剔除或替换），不确定的标 <b>unsure</b>。可以在输入框写备注。点 Save 保存到服务器（docs/review_v3/object_marks.json），刷新后会读回。</p>
<div class="grid" id="grid"></div>
<script>
let objs = [], marks = {};
const grid = document.getElementById('grid'), st = document.getElementById('status');
function counts() {
  const c = {keep:0, bad:0, unsure:0}; Object.values(marks).forEach(m => { if (c[m.mark] !== undefined) c[m.mark]++; });
  document.getElementById('counts').textContent = `${objs.length} objects · keep ${c.keep} · bad ${c.bad} · unsure ${c.unsure} · unmarked ${objs.length - c.keep - c.bad - c.unsure}`;
}
function render() {
  const f = document.getElementById('flt').value, sp = document.getElementById('split').value;
  grid.innerHTML = '';
  objs.forEach(o => {
    const m = marks[o.object] || {};
    if (f === 'none' && m.mark) return; if (f !== 'all' && f !== 'none' && m.mark !== f) return; if (sp !== 'all' && o.split !== sp) return;
    const card = document.createElement('div'); card.className = 'card ' + (m.mark || '');
    card.innerHTML = `${o.img ? `<img loading="lazy" src="${o.img}" alt="${o.object}">` : '<div class="meta">no rendered sample</div>'}
      <div class="name">${o.object.replace(/^a_/, '').replace(/_013020$/, '')}</div>
      <div class="meta">${o.split} · ${o.samples} V2 samples</div>
      <div class="row">${['keep','unsure','bad'].map(k => `<button class="${k} ${m.mark === k ? 'on' : ''}" data-k="${k}">${k}</button>`).join('')}</div>
      <input type="text" id="note-${o.object}" placeholder="note" value="${(m.note || '').replace(/"/g, '&quot;')}">`;
    card.querySelectorAll('button').forEach(b => b.onclick = () => {
      const cur = marks[o.object] || {}; cur.mark = cur.mark === b.dataset.k ? undefined : b.dataset.k; marks[o.object] = cur; st.textContent = 'unsaved changes'; render();
    });
    card.querySelector('input').onchange = e => { (marks[o.object] = marks[o.object] || {}).note = e.target.value; st.textContent = 'unsaved changes'; };
    grid.appendChild(card);
  });
  counts();
}
document.getElementById('flt').onchange = render; document.getElementById('split').onchange = render;
document.getElementById('save').onclick = async () => {
  st.textContent = 'saving…';
  try {
    const r = await fetch('api/object_marks', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(marks)});
    st.textContent = r.ok ? `saved ${Object.keys(marks).length} marks` : `save failed (${r.status})`;
  } catch (e) { st.textContent = 'save failed: ' + e; }
};
(async () => {
  objs = await (await fetch('objects.json')).json();
  try { const r = await fetch('object_marks.json?' + Date.now()); if (r.ok) marks = await r.json(); } catch (e) {}
  render();
})();
</script></body></html>
